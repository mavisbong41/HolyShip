name: Security Final Verification

on:
  push:
    branches:
      - feature/security-ai-gateway
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: holyship
          POSTGRES_PASSWORD: holyship
          POSTGRES_DB: holyship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holyship -d holyship_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://holyship:holyship@localhost:5432/holyship_dev
      HOLYSHIP_TEST_DATABASE_URL: postgresql+psycopg://holyship:holyship@localhost:5432/holyship_test
      HOLYSHIP_EVAL_DATABASE_URL: postgresql+psycopg://holyship:holyship@localhost:5432/holyship_eval
      ENTERPRISE_PRIVACY_MODE: "true"
      AI_GATEWAY_ALLOWED_PROVIDERS: gemini,google
      AI_GATEWAY_ALLOWED_MODELS: ""
      AI_GATEWAY_ALLOWED_ENDPOINT_HOSTS: generativelanguage.googleapis.com
      AI_ESCALATION_ENABLED: "false"
      AI_REVIEW_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Create isolated test databases
        env:
          PGPASSWORD: holyship
        run: |
          psql -h localhost -U holyship -d holyship_dev -c "CREATE DATABASE holyship_test;"
          psql -h localhost -U holyship -d holyship_dev -c "CREATE DATABASE holyship_eval;"
      - name: Compile Python
        run: python -m compileall -q backend/app backend/tests
      - name: Migration smoke
        run: python -m alembic upgrade head
      - name: Security focused suite
        run: python scripts/run_tests.py backend/tests/test_security_ai_gateway.py backend/tests/test_security_ai_gateway_postgres.py backend/tests/test_ai_review.py backend/tests/test_phase6_resolver.py backend/tests/test_phase6_resolution_postgres.py backend/tests/test_phase6_runtime.py -q
      - name: Full backend regression suite
        run: >-
          python scripts/run_tests.py -q
          --deselect=backend/tests/test_sync_service.py::test_sync_force_reclassifies_unchanged_email
      - name: Verify known force-sync baseline matches main
        run: |
          set +e
          python scripts/run_tests.py backend/tests/test_sync_service.py::test_sync_force_reclassifies_unchanged_email -q
          BRANCH_RC=$?
          git fetch origin main
          git worktree add /tmp/holyship-main origin/main
          cd /tmp/holyship-main
          python scripts/run_tests.py backend/tests/test_sync_service.py::test_sync_force_reclassifies_unchanged_email -q
          MAIN_RC=$?
          set -e
          echo "branch_rc=$BRANCH_RC main_rc=$MAIN_RC"
          test "$BRANCH_RC" -eq "$MAIN_RC"
      - name: Public 520-email baseline
        run: python scripts/run_baseline.py
      - name: Diff whitespace check
        run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Frontend full check
        run: npm --prefix frontend run check

  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: outlook-addin/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix outlook-addin
      - name: Outlook full check
        run: npm --prefix outlook-addin run check
