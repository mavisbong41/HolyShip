services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-holyship}
      POSTGRES_USER: ${POSTGRES_USER:-holyship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holyship}
    ports:
      - "5432:5432"
    volumes:
      - holyship_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-holyship} -d ${POSTGRES_DB:-holyship}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-holyship}:${POSTGRES_PASSWORD:-holyship}@postgres:5432/${POSTGRES_DB:-holyship}
      ORGANIZER_BUNDLE_PATH: /app/data/bundle
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173}
      DATA_LIFECYCLE_ENABLED: ${DATA_LIFECYCLE_ENABLED:-true}
      DATA_LIFECYCLE_DRY_RUN: ${DATA_LIFECYCLE_DRY_RUN:-true}
      DATA_LIFECYCLE_RUN_ON_STARTUP: ${DATA_LIFECYCLE_RUN_ON_STARTUP:-false}
      DATA_LIFECYCLE_INTERVAL_HOURS: ${DATA_LIFECYCLE_INTERVAL_HOURS:-24}
      RETENTION_RAW_EMAIL_BODY_DAYS: ${RETENTION_RAW_EMAIL_BODY_DAYS:-30}
      RETENTION_ATTACHMENT_DAYS: ${RETENTION_ATTACHMENT_DAYS:-90}
      RETENTION_CACHE_DAYS: ${RETENTION_CACHE_DAYS:-7}
      RETENTION_PROCESSING_JOBS_DAYS: ${RETENTION_PROCESSING_JOBS_DAYS:-30}
      RETENTION_PROCESSING_EVENTS_DAYS: ${RETENTION_PROCESSING_EVENTS_DAYS:-90}
      RETENTION_AI_SUGGESTIONS_DAYS: ${RETENTION_AI_SUGGESTIONS_DAYS:-30}
      RETENTION_INGESTION_CHECKPOINTS_DAYS: ${RETENTION_INGESTION_CHECKPOINTS_DAYS:-90}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/bundle:/app/data/bundle:ro
      - ./backend:/app/backend

volumes:
  holyship_postgres_data:

